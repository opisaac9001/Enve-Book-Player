name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep this check name stable because main branch protection requires it.
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Verify repository provenance
        run: ./scripts/verify-provenance

      - name: Validate Xcode project
        run: xcodebuild -project enve.xcodeproj -list >/dev/null
