<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — Enve OPDS Lab</title>
</head>
<body>
<h1>Sign in</h1>
<form method="post" action="/opds/malformed/login-page.html">
<label for="username">Username</label>
<input id="username" name="username" type="text" autocomplete="username">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password">
<button type="submit">Sign in</button>
</form>
<p>A catalog URL that answers 200 with a sign-in page must never be read as an empty feed.</p>
</body>
</html>
